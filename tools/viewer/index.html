<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VHL 결과 목록</title>
<style>
  :root { --bg:#fafafa; --fg:#1b1b1f; --muted:#6b6b75; --card:#fff; --line:#e3e3e8; --accent:#2457d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141417; --fg:#ececf0; --muted:#9a9aa6; --card:#1e1e23; --line:#2e2e35; --accent:#7aa2ff; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:2; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
           padding:10px 16px; background:var(--bg); border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0 8px 0 0; }
  input[type=search] { flex:1; min-width:180px; padding:7px 10px; border:1px solid var(--line); border-radius:6px;
                       background:var(--card); color:var(--fg); }
  select, button { padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  #count { color:var(--muted); }
  main { padding:16px; display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--card); border:1px solid var(--line);
           border-radius:8px; overflow:hidden; }
  a.card:hover { border-color:var(--accent); }
  .thumb { aspect-ratio:4/3; background:#f2f2f4; display:flex; align-items:center; justify-content:center; color:#888; font-size:12px; }
  .thumb img { width:100%; height:100%; object-fit:contain; display:block; }
  .meta { padding:8px 10px; }
  .title { font-weight:600; word-break:break-all; font-size:13px; }
  .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .chips { margin-top:4px; display:flex; flex-wrap:wrap; gap:4px; }
  .chip { font-size:11px; padding:1px 6px; border:1px solid var(--line); border-radius:10px; color:var(--muted); }
  #empty { padding:40px 16px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>VHL 결과 목록</h1>
  <input type="search" id="q" placeholder="경로·파일명 검색 (예: track_a, rider-head, output.glb)">
  <select id="root"></select>
  <button id="refresh" title="폴더를 다시 훑는다">새로고침</button>
  <span id="count"></span>
</header>
<main id="grid"></main>
<div id="empty" hidden>표시할 항목이 없다. GLB 가 들어 있는 폴더가 항목 하나가 된다.</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import { fileUrl, renderThumb } from '/common.js';

const grid = document.getElementById('grid');
const q = document.getElementById('q');
const rootSel = document.getElementById('root');
let all = [];
const queue = [];
let busy = false;

function fmtTime(t) {
  const d = new Date(t * 1000);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function load(refresh) {
  const r = await fetch('/api/items' + (refresh ? '?refresh=1' : ''));
  const data = await r.json();
  all = data.items;
  const cur = rootSel.value;
  rootSel.innerHTML = '<option value="">모든 루트</option>' +
    data.roots.map((p, i) => `<option value="${i}">${p.split('/').filter(Boolean).slice(-2).join('/')}</option>`).join('');
  rootSel.value = cur;
  render();
}

function render() {
  const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
  const rsel = rootSel.value;
  const items = all.filter((it) => {
    if (rsel !== '' && String(it.root) !== rsel) return false;
    const hay = (it.rel + ' ' + it.models.join(' ') + ' ' + it.root_name).toLowerCase();
    return words.every((w) => hay.includes(w));
  });
  document.getElementById('count').textContent = `${items.length} / ${all.length}`;
  document.getElementById('empty').hidden = items.length > 0;
  grid.innerHTML = '';
  queue.length = 0;
  const io = new IntersectionObserver((ents) => {
    ents.forEach((e) => {
      if (!e.isIntersecting) return;
      io.unobserve(e.target);
      const it = e.target._item;
      const el = e.target.querySelector('.thumb');
      if (it.thumb_file || it.thumb_cached) { setImageThumb(el, it); return; }
      queue.push({ el, it });
      pump();
    });
  }, { rootMargin: '300px' });
  for (const it of items) {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = `/view?id=${encodeURIComponent(it.id)}`;
    a._item = it;
    a.innerHTML = `<div class="thumb">…</div>
      <div class="meta"><div class="title"></div><div class="sub"></div><div class="chips"></div></div>`;
    a.querySelector('.title').textContent = it.title;
    a.querySelector('.sub').textContent = `${it.root_name} · ${fmtTime(it.mtime)}`;
    a.querySelector('.chips').innerHTML = it.models.map((m) => `<span class="chip">${m}</span>`).join('');
    grid.appendChild(a);
    io.observe(a);
  }
}

// 썸네일: 폴더 이미지·캐시가 있으면 바로 <img>(대기열 없음).
// 없으면 GLB 렌더 대기열에 넣어 한 번에 하나씩 브라우저에서 렌더하고 서버 캐시에 올린다.
// 한 건이 RENDER_TIMEOUT 안에 안 끝나면 실패로 표시하고 다음으로 넘어간다.
const RENDER_TIMEOUT = 20000;

function setImageThumb(el, it) {
  const img = new Image();
  img.alt = it.title;
  img.loading = 'lazy';
  img.onerror = () => { el.textContent = '이미지 없음'; };
  img.src = `/thumb?id=${encodeURIComponent(it.id)}&k=${it.thumb_key}`;
  el.replaceChildren(img);
}

function withTimeout(p, ms) {
  return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(`timeout ${ms} ms`)), ms))]);
}

async function pump() {
  if (busy) return;
  busy = true;
  while (queue.length) {
    const { el, it } = queue.shift();
    if (!el.isConnected) continue;
    el.textContent = '렌더 중…';
    try {
      const blob = await withTimeout(renderThumb(fileUrl(it.id, it.models[0])), RENDER_TIMEOUT);
      fetch(`/api/thumb?id=${encodeURIComponent(it.id)}`, { method: 'POST', body: blob })
        .catch((e) => console.warn('thumb upload failed', it.id, e));
      it.thumb_cached = true;
      const img = new Image();
      img.alt = it.title;
      img.src = URL.createObjectURL(blob);
      el.replaceChildren(img);
    } catch (err) {
      el.textContent = '썸네일 실패 (클릭하면 3D 보기)';
      console.error('thumb', it.id, err);
    }
  }
  busy = false;
}

q.addEventListener('input', render);
rootSel.addEventListener('change', render);
document.getElementById('refresh').addEventListener('click', () => load(true));
try { q.value = sessionStorage.getItem('vhl_q') || ''; } catch (e) {}
q.addEventListener('change', () => { try { sessionStorage.setItem('vhl_q', q.value); } catch (e) {} });
load(false);
</script>
</body>
</html>
